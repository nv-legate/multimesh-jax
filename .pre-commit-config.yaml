repos:
    - repo: https://github.com/PyCQA/isort
      rev: 5.12.0
      hooks:
            - id: isort
    - repo: https://github.com/psf/black
      rev: 23.7.0
      hooks:
            - id: black
    - repo: https://github.com/PyCQA/flake8
      rev: 6.0.0
      hooks:
            - id: flake8
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: 'v20.1.0'
      hooks:
        - id: clang-format
          files: \.(cu|cuh|h|cc|inl)$
          types_or: []


default_language_version:
    python: python3
