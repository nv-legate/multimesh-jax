[versioneer]
VCS = git
style = pep440
versionfile_source = legate/jax/_version.py
versionfile_build = legate/jax/_version.py
tag_prefix = v
parentdir_prefix = legate-jax-

[flake8]
exclude = __init__.py
ignore =
    # line break before binary operator
    W503
    # whitespace before :
    E203
    # undefined, or defined from star imports
    F405
per-file-ignores =
     legate/jax/lib.py: F841
     tests/python/jax_auto_task_test.py: E402
     tests/python/jax_task_test.py: E402
     tests/python/jax_microbatch_test.py: E402

[isort]
line_length=79
multi_line_output=3
include_trailing_comma=True
force_grid_wrap=0
combine_as_imports=True
order_by_type=True
known_third_party=
    numpy
known_legion=
    legion_cffi
    legion_top
known_first_party=
    legate
default_section=THIRDPARTY
sections=FUTURE,STDLIB,THIRDPARTY,LEGION,FIRSTPARTY,LOCALFOLDER
skip=
    .eggs
    .git
    .mypy_cache
    .tox
    .venv
    _build
    build
    dist
    legion
    __init__.py

[options]
packages = find:
install_requires =
    numpy>=1.22
    # TODO: Add rest of install dependencies
python_requires = >=3.8
